[package]
name = "gmsv_serversecure"
version = "1.0.0"
edition = "2021"
description = "ServerSecure – Garry's Mod server security module (Rust port)"

[lib]
crate-type = ["cdylib"]

[dependencies]
gmod        = { git = "https://github.com/WilliamVenner/gmod-rs", default-features = false }
ctor        = "=1.0.3"
parking_lot = "0.12"
sha1        = "0.11.0"
rand        = "0.10.1"
once_cell   = "1"

[target.'cfg(not(all(windows, target_arch = "x86")))'.dependencies]
retour = { git = "https://github.com/Hpmason/retour-rs", branch = "master", features = ["static-detour"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true


