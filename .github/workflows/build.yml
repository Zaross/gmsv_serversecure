name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 \
            gcc-multilib \
            zip

      - name: Set up Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add \
            x86_64-pc-windows-gnu \
            i686-pc-windows-gnu \
            x86_64-unknown-linux-gnu \
            i686-unknown-linux-gnu \
            --toolchain nightly

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build – Windows 64-bit
        run: cargo +nightly build --release --target x86_64-pc-windows-gnu

      - name: Build – Windows 32-bit
        run: cargo +nightly build --release --target i686-pc-windows-gnu

      - name: Build – Linux 64-bit
        run: cargo +nightly build --release --target x86_64-unknown-linux-gnu

      - name: Build – Linux 32-bit
        run: cargo +nightly build --release --target i686-unknown-linux-gnu

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/gmsv_serversecure.dll      dist/gmsv_serversecure_win64.dll
          cp target/i686-pc-windows-gnu/release/gmsv_serversecure.dll         dist/gmsv_serversecure_win32.dll
          cp target/x86_64-unknown-linux-gnu/release/libgmsv_serversecure.so  dist/gmsv_serversecure_linux64.dll
          cp target/i686-unknown-linux-gnu/release/libgmsv_serversecure.so    dist/gmsv_serversecure_linux.dll

      - name: Create source archive
        run: |
          git archive --format=zip --prefix=gmsv_serversecure/ HEAD \
            -o dist/source.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmsv_serversecure-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/gmsv_serversecure_win64.dll
            dist/gmsv_serversecure_win32.dll
            dist/gmsv_serversecure_linux64.dll
            dist/gmsv_serversecure_linux.dll
            dist/source.zip
